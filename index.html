<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProNote Studio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap">
          <div class="brand-mark">P</div>
          <div>
            <p class="eyebrow">Workspace</p>
            <h2>ProNote</h2>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Total notes</span>
            <strong id="totalNotesStat">0</strong>
          </div>
          <div class="stat-card accent-school">
            <span class="stat-label">Categories</span>
            <strong id="categoryStat">4</strong>
          </div>
          <div class="stat-card accent-work">
            <span class="stat-label">Saved</span>
            <strong id="saveStatusStat">Ready</strong>
          </div>
        </div>

        <div class="sidebar-section">
          <p class="section-title">Quick filters</p>
          <div class="filter-chips" id="quickFilters">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="Work">Work</button>
            <button class="chip" data-filter="School">School</button>
            <button class="chip" data-filter="Personal">Personal</button>
            <button class="chip" data-filter="Ideas">Ideas</button>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Daily planner</p>
            <h1>My Notes</h1>
          </div>

          <div class="topbar-actions">
            <button class="ghost-btn" id="themeToggle" type="button">Dark mode</button>
            <button class="ghost-btn danger" id="clearAllBtn" type="button">Clear all</button>
          </div>
        </header>

        <section class="toolbar">
          <label class="search-box" aria-label="Search notes">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="search" placeholder="Search notes" />
          </label>

          <label class="select-wrap" aria-label="Filter by category">
            <span>Category</span>
            <select id="categoryFilter">
              <option value="all">All categories</option>
              <option value="Work">Work</option>
              <option value="School">School</option>
              <option value="Personal">Personal</option>
              <option value="Ideas">Ideas</option>
            </select>
          </label>
        </section>

        <section class="composer card-panel">
          <div class="composer-header">
            <div>
              <p class="eyebrow">Capture</p>
              <h3 id="composerTitle">New note</h3>
            </div>
            <span id="charCount">0 / 500</span>
          </div>

          <div class="composer-body">
            <label class="select-wrap full-width" aria-label="Select note category">
              <span>Category</span>
              <select id="categorySelect">
                <option value="Work">Work</option>
                <option value="School">School</option>
                <option value="Personal">Personal</option>
                <option value="Ideas">Ideas</option>
              </select>
            </label>

            <label class="textarea-wrap" aria-label="Write a note">
              <span>Your note</span>
              <textarea id="noteInput" maxlength="500" placeholder="Write a fresh idea, reminder, or task..."></textarea>
            </label>
          </div>

          <div class="composer-actions">
            <button class="secondary-btn" id="resetBtn" type="button">Reset</button>
            <button class="primary-btn" id="addBtn" type="button">Add note</button>
          </div>
        </section>

        <section class="notes-panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Overview</p>
              <h3>Recent notes</h3>
            </div>

            <div class="sort-buttons">
              <button class="sort-btn active" data-sort="newest" type="button">Newest</button>
              <button class="sort-btn" data-sort="oldest" type="button">Oldest</button>
              <button class="sort-btn" id="exportBtn" type="button">Export</button>
            </div>
          </div>

          <div id="notes" class="notes-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
